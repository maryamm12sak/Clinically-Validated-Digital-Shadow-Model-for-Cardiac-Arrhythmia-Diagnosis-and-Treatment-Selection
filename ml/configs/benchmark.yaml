# Benchmark configuration. Paths are absolute on Ali's machine; override per machine.
data:
  data_root: G:/IBA/FYP/data/ptb-xl-1.0.3
  cache_dir: G:/IBA/FYP/data/cache
  features_path: G:/IBA/FYP/data/features/features_500hz.csv   # CSV: pyarrow (parquet) not installed
  sampling_rate: 100          # deep models; classical features use feature_sampling_rate
  feature_sampling_rate: 500
  labels_config: configs/labels.yaml   # relative to ml/
  exclude_invalid: false      # if true, drop records failing validation (see data_loader reason codes)

splits:
  train: [1, 2, 3, 4, 5, 6, 7, 8]
  val: [9]
  test: [10]
  test_locked: true           # fold 10 is only readable with allow_test=True

seeds: [0, 1, 2]

dev_subset:
  enabled: false
  fraction: 0.1               # stratification not applied; random sample of records per split
  seed: 0
  apply_to: [train]           # evaluate on the full validation fold even in dev runs

preprocessing:
  window_s: 2.5
  inference_overlap: 0.5
  normalization: per_lead_zscore   # fit on train split only
  bandpass:
    enabled: false
    low_hz: 0.5
    high_hz: 40.0
    order: 4

features:
  r_peak_lead: II
  r_peak_fallback_leads: [V5, I]
  n_jobs: -1

models:
  # Classical model hyperparameters live in src/models/classical.py (recorded in config_hash).
  logistic_regression: {}
  lightgbm: {}

deep_models:
  # Trained on the 100 Hz cache: random window_s crops for training; fold-9 evaluation on sliding
  # windows (inference_overlap) with per-label max over windows (Strodthoff et al. 2021).
  epochs: 50
  batch_size: 128
  eval_batch_size: 512
  lr: 1.0e-2                  # OneCycleLR max_lr (untuned default, as in Strodthoff et al. 2021)
  weight_decay: 1.0e-2        # AdamW
  patience: 8                 # early stopping on fold-9 macro-AUROC (primary labels)
  pos_weight: false           # per-label pos_weight = n_neg / n_pos in BCEWithLogitsLoss
  num_threads: 8              # torch.set_num_threads; physical cores of a Ryzen 7 5700X
  simple_cnn:
    concat_pool: false
  resnet1d:
    widths: [64, 128, 128, 256]
    blocks: [2, 2, 2, 2]
    kernel: 5
    concat_pool: true
  inception1d:
    depth: 6
    nb_filters: 32
    kss: [39, 19, 9]
    bottleneck: 32
    residual_every: 3
    concat_pool: true
  cnn_lstm:
    channels: 128
    hidden: 128
    lstm_layers: 2
    concat_pool: true
